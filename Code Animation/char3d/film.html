  key.intensity = c.key ?? 1.6; hemi.intensity = c.hemi ?? 0.4; scene.environmentIntensity = c.env ?? 0.35;
  bloom.strength = c.bloom ?? 0.5; if (!window.NORENDER) comp.render();
  return c;
}
// 충돌 검사: 각 캐릭터 부위끼리(허용 쌍 제외) / 캐릭터 ↔ 세트 / 캐릭터 ↔ 캐릭터 / 바닥 아래
const bvh = new Map(); const bvhOf = m => { if (!bvh.has(m.geometry)) bvh.set(m.geometry, new MeshBVH(m.geometry)); return bvh.get(m.geometry); };
const HEART_ALLOW = new Set(['body|upL', 'body|upR', 'upL|loL', 'upR|loR', 'loL|handL', 'loR|handR', 'upL|handL', 'upR|handR', 'handR|box', 'handR|ticket', 'loR|ticket', 'body|cap', 'body|brim', 'cap|brim', 'cap|btn', 'body|footL', 'body|footR', 'footR|footTicket', 'body|footTicket'].map(k => k.split('|').sort().join('|')));

const boxA = new THREE.Box3(), boxB = new THREE.Box3();
const hit = (a, b) => {
  if (!a.geometry.boundingBox) a.geometry.computeBoundingBox(); if (!b.geometry.boundingBox) b.geometry.computeBoundingBox();
  boxA.copy(a.geometry.boundingBox).applyMatrix4(a.matrixWorld); boxB.copy(b.geometry.boundingBox).applyMatrix4(b.matrixWorld);
  if (!boxA.intersectsBox(boxB)) return false;                                   // 상자끼리 안 겹치면 바로 통과
  bvhOf(a); b.geometry.boundsTree = bvhOf(b);                                    // 양쪽 다 BVH(맞은편을 삼각형 하나하나 훑지 않게)
  tmp.copy(a.matrixWorld).invert().multiply(b.matrixWorld); return bvhOf(a).intersectsGeometry(b.geometry, tmp); };
const visibleMesh = m => { let o = m; while (o) { if (!o.visible) return false; o = o.parent; } return true; };
function collide(extraAllow = []) {
  scene.updateMatrixWorld(true); const out = [], ex = new Set([...extraAllow, ...(window.ALLOW || []),
    ...['body', 'footL', 'footR', 'upL', 'upR', 'loL', 'loR', 'handL', 'handR', 'cap', 'brim', 'btn', 'ticket'].map(p => `heart:${p}|hammock`)]);   // 해먹(천)에 눕는 접촉은 정상
  for (const k of active) { const r = R[k], M = r.meshes, n = Object.keys(M).filter(x => visibleMesh(M[x])), allow = r.allow || HEART_ALLOW;
    for (let i = 0; i < n.length; i++) for (let j = i + 1; j < n.length; j++) { const kk = [n[i], n[j]].sort().join('|'); if (allow.has(kk)) continue; if (hit(M[n[i]], M[n[j]])) out.push(`${k}:${kk}`); }
    for (const nm of n) { for (const s of curSet.SOLID) { if (!visibleMesh(s)) continue; const tag = `${k}:${nm}|${s.name}`; if (ex.has(tag) || ex.has(`${k}:*|${s.name}`)) continue; if (hit(M[nm], s)) { if (qs.get('dbg')) { const a = M[nm].getWorldPosition(new THREE.Vector3()), b = new THREE.Box3().setFromObject(s).getCenter(new THREE.Vector3()); out.push(tag + `@${a.x.toFixed(2)},${a.y.toFixed(2)},${a.z.toFixed(2)}~${b.x.toFixed(2)},${b.y.toFixed(2)},${b.z.toFixed(2)}`); } else out.push(tag); } }
      const bb = new THREE.Box3().setFromObject(M[nm], true); if (bb.min.y < -0.005) out.push(`${k}:${nm}|floor`); } }
  for (let a = 0; a < active.length; a++) for (let b = a + 1; b < active.length; b++) { const A = R[active[a]].meshes, B = R[active[b]].meshes;
    for (const x of Object.keys(A)) for (const y of Object.keys(B)) if (visibleMesh(A[x]) && visibleMesh(B[y]) && hit(A[x], B[y])) out.push(`${active[a]}:${x}|${active[b]}:${y}`); }
  return out;
}
window.R = R; window.SETS = SETS; window.THREE = THREE; window.probe = (pose) => { const H = R.heart; H.hold('ticket'); H.pose({ x: 0, z: 0, jump: 0, turn: 0, ...pose }); scene.updateMatrixWorld(true);
  const t = H.ticket.getWorldPosition(new THREE.Vector3()), b = new THREE.Box3().setFromObject(H.ticket, true); return { c: [t.x, t.y, t.z].map(v => +v.toFixed(2)), min: [b.min.x, b.min.z].map(v => +v.toFixed(2)), max: [b.max.x, b.max.z].map(v => +v.toFixed(2)) }; };

  let b64 = ''; const u = r.glb; for (let i = 0; i < u.length; i += 0x8000) b64 += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); r.glb = btoa(b64); return r; };
