<!doctype html><html><body style="margin:0;background:transparent">
<canvas id="c" width="1920" height="1040"></canvas>
<script src="node_modules/three/build/three.min.js"></script>
<script src="sol3d.js"></script>
<script src="chars3d.js"></script>
<script>
// 3D model sheet stage: 솔이, 엄마, 꾸럭이 (on a rock + a 4x detail copy). Passes: color / id / normal / depth / char.
const W = 1920, H = 1040;
const renderer = new THREE.WebGLRenderer({canvas: document.getElementById('c'), antialias: true, alpha: true, preserveDrawingBuffer: true});
renderer.setPixelRatio(1); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.BasicShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const BG = new THREE.Color(0xeee6d4);
const cam = new THREE.PerspectiveCamera(30, W / H, 0.1, 60);
const ramp = new THREE.DataTexture(new Uint8Array([70, 70, 70, 255, 150, 150, 150, 255, 255, 255, 255, 255]), 3, 1);
ramp.minFilter = ramp.magFilter = THREE.NearestFilter; ramp.needsUpdate = true;
function toon(hex) { return new THREE.MeshToonMaterial({color: hex, gradientMap: ramp}); }
const sun = new THREE.DirectionalLight(0xfff3dc, 2.8); sun.position.set(-3, 6, 4); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.002; sun.shadow.normalBias = 0.04;
Object.assign(sun.shadow.camera, {left: -3, right: 3, top: 3, bottom: -3, near: 0.5, far: 20});
scene.add(sun); scene.add(new THREE.HemisphereLight(0xf2f6ff, 0x8a8070, 1.3));

const objects = [], charSet = new Set(), colorOnly = [];
let nextId = 1;
function reg(m, isChar) { m.userData.id = nextId++; m.userData.colorMat = m.material; objects.push(m); if (isChar) charSet.add(m); }
const floor = new THREE.Mesh(new THREE.CircleGeometry(4, 64), toon(0xd8cdb4)); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true;
scene.add(floor); reg(floor, false);

const sol = makeSol(THREE, toon); sol.group.position.set(-0.55, 0, 0); scene.add(sol.group);
sol.parts.forEach(m => reg(m, true)); colorOnly.push(...sol.colorOnly);
const mom = makeMom(THREE, toon); mom.group.position.set(0.45, 0, -0.1); scene.add(mom.group);
mom.parts.forEach(m => reg(m, true)); colorOnly.push(...mom.colorOnly);
// a lava stone with 꾸럭이 on it (true scale) and a big detail copy
const stone = new THREE.Mesh(new THREE.IcosahedronGeometry(0.16, 1), toon(0x55504e)); stone.scale.set(1.2, 0.55, 1);
stone.position.set(0.0, 0.07, 0.75); stone.castShadow = stone.receiveShadow = true; scene.add(stone); reg(stone, false);
const ku = makeKuruk(THREE, toon, 1.0); ku.group.position.set(0.0, 0.15, 0.75); scene.add(ku.group);
ku.parts.forEach(m => reg(m, true)); colorOnly.push(...ku.colorOnly);
const kuBig = makeKuruk(THREE, toon, 3.2); kuBig.group.position.set(1.3, 0.1, 0.45); kuBig.group.rotation.y = -0.4; scene.add(kuBig.group);
kuBig.parts.forEach(m => reg(m, true)); colorOnly.push(...kuBig.colorOnly);

const normalMat = new THREE.MeshNormalMaterial({side: THREE.DoubleSide});
const depthMat = new THREE.MeshDepthMaterial({side: THREE.DoubleSide});
const white = new THREE.MeshBasicMaterial({color: 0xffffff, side: THREE.DoubleSide}), black = new THREE.MeshBasicMaterial({color: 0x000000, side: THREE.DoubleSide});
objects.forEach(o => { const id = o.userData.id;
  o.userData.idMat = new THREE.MeshBasicMaterial({color: new THREE.Color(((id * 97) % 256) / 255, ((id * 57 + 40) % 256) / 255, ((id * 23 + 90) % 256) / 255), side: THREE.DoubleSide}); });

const ss = x => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
window.VIEW = null;           // fixed views for the sheet: [azimuth deg, height, distance, lookY]
function camAt(t) {
  let az, h, d, ly;
  if (window.VIEW) [az, h, d, ly] = window.VIEW;
  else { const tq = Math.floor(t * 12) / 12; az = -30 + 360 * ss(tq / 8); h = 0.9 + 0.5 * Math.sin(tq * 0.8); d = 4.4; ly = 0.75; }
  const a = az * Math.PI / 180;
  cam.position.set(0.25 + Math.sin(a) * d, h, Math.cos(a) * d); cam.lookAt(0.25, ly, 0.1);
}
window.animate = (t) => {
  const tq = Math.floor(t * 12) / 12;
  const blink = (tq % 3.0) > 2.85;
  sol.setFace({mouth: 0, eyes: blink ? 'blink' : 'open', smile: 1});
  mom.setFace({mouth: 0, eyes: (tq % 3.7) > 3.55 ? 'blink' : 'open', smile: 0.6});
  ku.setState('orange'); kuBig.setState(['grey', 'orange', 'white', 'pink'][Math.floor(tq / 2) % 4]);
  ku.blink((tq % 2.3) > 2.2); kuBig.blink((tq % 2.3) > 2.2);
  sol.pose({pitch: 0.05, armLx: -0.1, armRx: -0.1, armL: 0.05, armR: 0.05});
  mom.pose({pitch: 0.0, yaw: -0.15});
};
window.renderAt = (t, pass) => {
  camAt(t); window.animate(t);
  colorOnly.forEach(m => m.visible = pass === 'color');
  if (pass === 'color') { scene.background = BG; objects.forEach(o => o.material = o.userData.colorMat); }
  else {
    scene.background = new THREE.Color(0x000000);
    objects.forEach(o => o.material = pass === 'id' ? o.userData.idMat : pass === 'normal' ? normalMat : pass === 'depth' ? depthMat
                                       : (charSet.has(o) ? white : black));
  }
  renderer.render(scene, cam); return true;
};
window.info = () => objects.length;
</script></body></html>
