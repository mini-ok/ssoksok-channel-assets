<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{
 "three":"./node_modules/three/build/three.module.js",
 "three/webgpu":"./node_modules/three/build/three.webgpu.js",
 "three/addons/":"./node_modules/three/examples/jsm/",
 "three/examples/jsm/":"./node_modules/three/examples/jsm/",
 "three-mesh-bvh":"./node_modules/three-mesh-bvh/build/index.module.js",
 "three-gpu-pathtracer":"./node_modules/three-gpu-pathtracer/build/index.module.js",
 "xatlas-web":"./node_modules/xatlas-web/dist/xatlas-web.js"}}</script>
</head><body>
<script type="module">
// ?mode=raster|pt  &w=&h=
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { build, animate, CAM, SUN, focusAt } from './scene.js';

const qs = new URLSearchParams(location.search);
const MODE = qs.get('mode') || 'raster', W = +(qs.get('w') || 1920), H = +(qs.get('h') || 1080);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.toneMapping = THREE.AgXToneMapping; renderer.toneMappingExposure = 0.85;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = build();
const camera = new THREE.PerspectiveCamera(CAM.fov, W / H, 0.02, 30);
camera.position.set(...CAM.pos); camera.lookAt(...CAM.target);

// 하늘(창밖) 환경: 위는 맑은 하늘, 아래는 따뜻한 바닥 반사
function skyTex() {
  const w = 512, h = 256, data = new Float32Array(w * h * 4);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const v = 1 - y / h, el = (v - 0.5) * Math.PI, i = (y * w + x) * 4;
    let c;
    if (el > 0) { const k = Math.pow(1 - el / (Math.PI / 2), 3); c = [0.55 + 0.45 * k, 0.72 + 0.25 * k, 1.0]; c = c.map(q => q * (1.2 + 0.8 * k)); }
    else c = [0.42, 0.34, 0.26];
    data.set([c[0], c[1], c[2], 1], i);
  }
  const t = new THREE.DataTexture(data, w, h, THREE.RGBAFormat, THREE.FloatType);
  t.mapping = THREE.EquirectangularReflectionMapping; t.needsUpdate = true; return t;
}
const sunDir = new THREE.Vector3(...SUN.dir).normalize();
const sun = new THREE.DirectionalLight(SUN.color, SUN.intensity);
sun.target.position.set(-0.9, 0, -0.9); sun.position.copy(sun.target.position).addScaledVector(sunDir, 6);
scene.add(sun, sun.target);

let draw;
if (MODE === 'raster') {
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.12;
  scene.background = new THREE.Color('#0d0b0a');
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.VSMShadowMap;
  sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096); sun.shadow.radius = 6; sun.shadow.blurSamples = 16; sun.shadow.bias = -0.0003;
  const sc = sun.shadow.camera; sc.left = -3; sc.right = 3; sc.top = 3; sc.bottom = -3; sc.near = 0.5; sc.far = 14;
  // 방 안을 채우는 반사광(창 반대편에서 오는 따뜻한 되비침)
  const bounce = new THREE.HemisphereLight('#bcd2ff', '#7a4a2a', 0.12); scene.add(bounce);
  const fill = new THREE.PointLight('#ffc890', 0.6, 4, 2); fill.position.set(-1.2, 0.25, -0.6); scene.add(fill);
  const comp = new EffectComposer(renderer);
  comp.addPass(new RenderPass(scene, camera));
  const ao = new GTAOPass(scene, camera, W, H); ao.output = GTAOPass.OUTPUT.Default;
  ao.updateGtaoMaterial({ radius: 0.25, distanceExponent: 1.2, thickness: 2.5, scale: 1.6, samples: 16 }); comp.addPass(ao);
  comp.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.35, 0.6, 0.85));
  const bokeh = new BokehPass(scene, camera, { focus: CAM.focus, aperture: 0.0025, maxblur: 0.006 }); comp.addPass(bokeh);
  comp.addPass(new OutputPass());
  draw = async (t) => { animate(scene, t); bokeh.uniforms.focus.value = focusAt(scene, camera); comp.render(); };
} else {
  const { WebGLPathTracer, PhysicalCamera } = await import('three-gpu-pathtracer');
  const pc = new PhysicalCamera(CAM.fov, W / H, 0.02, 30);
  pc.position.copy(camera.position); pc.quaternion.copy(camera.quaternion);
  pc.focusDistance = CAM.focus; pc.fStop = CAM.fStop; pc.apertureBlades = 6;
  scene.environment = skyTex(); scene.environmentIntensity = 1.0; scene.background = new THREE.Color('#0d0b0a');
  const pt = new WebGLPathTracer(renderer);
  pt.tiles.set(2, 2); pt.minSamples = 1; pt.renderDelay = 0; pt.fadeDuration = 0; pt.bounces = 6; pt.filterGlossyFactor = 0.5;
  draw = async (t, samples = 64) => {
    animate(scene, t); scene.updateMatrixWorld(true); pc.focusDistance = focusAt(scene, pc);
    pt.setScene(scene, pc);
    while (pt.samples < samples) { pt.renderSample(); if (pt.samples % 8 === 0) await new Promise(r => setTimeout(r, 0)); }
  };
}
window.renderAt = async (t, samples) => { const t0 = performance.now(); await draw(t, samples); return performance.now() - t0; };
window.ready = true;
</script></body></html>
